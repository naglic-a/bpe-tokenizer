[package]
name = "bpe-tokenizer"
version = "0.2.2"
edition = "2024"

[lib]
name = "bpe_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
rustc-hash = "2.1.3"
